kendo:
  llmkit:
    # The aria-label for a collapsed disclosure head without visible text.
    expandLabel: Expandir

    # The aria-label for an expanded disclosure head without visible text.
    collapseLabel: Recolher

    # The text for the ToolCall's default Approve action.
    approveAction: Aprovar

    # The text for the ToolCall's default Reject action.
    rejectAction: Rejeitar

    # The label shown above the ToolCall's default formatted-JSON parameters block.
    parametersLabel: Parâmetros

    # The label shown above the ToolCall's default formatted-JSON result block.
    resultLabel: Resultado

    # The default ToolCall badge text for the awaiting approval state.
    awaitingApprovalStatus: Aguardando aprovação

    # The default ToolCall badge text for the completed state.
    completedStatus: Concluído

    # The default ToolCall badge text for the error state.
    errorStatus: Erro

    # The aria-label for the Citation popover's Previous-source action.
    previousSourceAction: Fonte anterior

    # The aria-label for the Citation popover's Next-source action.
    nextSourceAction: Próxima fonte

    # The text for the Checkpoint's default action in the startOver state.
    startOverAction: Recomeçar

    # The text for the Checkpoint's default action in the restore state.
    restoreAction: Restaurar checkpoint

    # The text for the Checkpoint's default action in the redo state.
    redoAction: Refazer

    # The text for the Checkpoint's default stamp shown in the redo state.
    checkpointRestoredText: Checkpoint restaurado
